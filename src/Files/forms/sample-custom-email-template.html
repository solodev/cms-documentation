<html>
<head><title>Form Submission Received</title></head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #222;">
  <table cellpadding="0" cellspacing="0" style="max-width:600px; border:1px solid #ddd;">
    <tr>
      <td style="background:#0b3d91; padding:16px 24px;">
        <span style="color:#fff; font-size:18px; font-weight:bold;">New Form Submission</span>
      </td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 16px;">You have a new submission with the following details:</p>
        <table cellpadding="6" cellspacing="0" style="width:100%; border-collapse:collapse;">
          <tr>
            <td style="border-bottom:1px solid #eee;"><strong>Name</strong></td>
            <td style="border-bottom:1px solid #eee;">{{givenname}} {{sn}}</td>
          </tr>
          <tr>
            <td style="border-bottom:1px solid #eee;"><strong>Email</strong></td>
            <td style="border-bottom:1px solid #eee;">{{email}}</td>
          </tr>
          <tr>
            <td style="border-bottom:1px solid #eee;"><strong>Phone</strong></td>
            <td style="border-bottom:1px solid #eee;">{{primaryphone}}</td>
          </tr>
          <!--
            Add one row per extra field on your form's Table Schema.
            Replace "your_field_name" with the exact field name shown there.
          -->
          <tr>
            <td style="border-bottom:1px solid #eee;"><strong>Your Field Label</strong></td>
            <td style="border-bottom:1px solid #eee;">{{your_field_name}}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
